[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "evolooption"
version = "0.1.0"
description = "Retired and frozen historical domain-agnostic agent framework."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
classifiers = [
  "Development Status :: 7 - Inactive",
]
authors = [
  { name = "Evolooption contributors" }
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-xdist>=3.5.0",
  "ruff>=0.5.0"
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# Declare custom markers so pytest --markers works and tests can be
# selected with -m "not slow" without "PytestUnknownMarkWarning". No test
# currently exceeds the slow threshold; this reserves the convention for
# consumers and future growth of the suite.
markers = [
    "slow: marks tests as slow-running (skipped with -m 'not slow')",
]
